name: dcomp-test

services:
  mysql:
    image: mysql:8.4
    command: ["mysqld", "--default-time-zone=+00:00"]
    environment:
      MYSQL_DATABASE: dcomp_test
      MYSQL_USER: dcomp_test
      MYSQL_PASSWORD: test-password
      MYSQL_ROOT_PASSWORD: test-root-password
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' > /dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s

  test:
    build:
      context: ./backend
      target: test
    environment:
      DB_HOST: mysql
      DB_NAME: dcomp_test
      DB_USER: dcomp_test
      DB_PASSWORD: test-password
      REDIS_URL: redis://redis:6379
      JWT_SECRET: test-only-secret-with-at-least-32-characters
      APP_ORIGIN: http://localhost
      COOKIE_SECURE: "false"
      DOCUMENT_WORKER_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

networks:
  default:
    internal: true
